name: Check Secret Configured

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret presence without printing value
        env:
          DINEDESK_DEMO_KEY: ${{ secrets.DINEDESK_DEMO_KEY }}
        run: |
          if [ -z "$DINEDESK_DEMO_KEY" ]; then
            echo "DINEDESK_DEMO_KEY is not set"
            exit 1
          fi
          echo "DINEDESK_DEMO_KEY is configured (length: ${#DINEDESK_DEMO_KEY})"